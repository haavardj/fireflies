<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en" xmlns:nevow="http://nevow.com/ns/nevow/0.1">
	<link href="css/ff.css" type="text/css" rel="stylesheet" />

  <body>

	<div nevow:pattern="peerInfo">
     <table class="peerbox" cellspacing="0" border="0" cellpadding="3">
    	<tr>
	  	<td>Id</td><td><span  nevow:render="id">1234</span></td>
			</tr>
     	<tr>
	  	<td>Address</td><td><span  nevow:render="address">1234</span></td>
			</tr>
			<tr>
				<td>Badness</td> <td><span nevow:render="badness">Correct</span></td>
			</tr>
			<tr>
				<td>Private key</td><td><span  nevow:render="priv">No</span></td>
			</tr>
    </table>
  </div>

  <div class="ringbox" nevow:pattern="rings">
  
   <div nevow:render="sequence">	  
   <table class="ringbox" nevow:render="sequence" cellspacing="0px" border="5px">   	
 		 <tr nevow:pattern="item" nevow:render="sequence"> 
 		   <td class="row-odd" ><span style="border: 10px;" nevow:pattern="item" nevow:render="peer">ee</span></td>
 		   <td class="row-even" nevow:pattern="item" nevow:render="peer">hostname</td>
 		 </tr>
   </table>



   
   </div>
   
  </div>	


 <span class="memberbox" nevow:pattern="members">
      <table valing="top" nevow:render="sequence" cellpadding="0" cellspacing="0">
			<tr class="row-odd" nevow:pattern="item">
				<td nevow:render="peer">localhost1</td>
			</tr>
			<tr class="row-even" nevow:pattern="item">
				<td nevow:render="peer">localhost2</td>
			</tr>
    </table>
</span>

       
  </body>
</html>
