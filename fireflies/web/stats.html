<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en" xmlns:nevow="http://nevow.com/ns/nevow/0.1">
  <body>
        
	<div nevow:pattern="content">

	<h2>Statistic</h2>
	<div class="graph">
		<h3>Members</h3>
		<img src="/images/members.png" border="0" alt=""/>
	</div>

	<div class="graph">
		<h3>UDP Traffic</h3>
		<img src="/images/udp.png" border="0" alt=""/>
	</div>

	<div class="graph">
		<h3>TCP Traffic</h3>
		<img src="/images/tcp.png" border="0" alt=""/>
	</div>

	<div class="graph">
		<h3># TCP Open</h3>
		<img src="/images/tcpopen.png" border="0" alt=""/>
	</div>

	<div class="graph">
		<h3># CPU load</h3>
		<img src="/images/cpu.png" border="0" alt=""/>
	</div>


	<div class="graph">
		<h3># Certificates, Notes, and Accusations</h3>
		<img src="/images/data.png" border="0" alt=""/>
	</div>

	<div class="graph">
		<h3># Accusations made</h3>
		<img src="/images/createdacc.png" border="0" alt=""/>
	</div>

	<div class="graph">
		<h3># Gossip exchanges</h3>
		<img src="/images/exchanges.png" border="0" alt=""/>
	</div>

	<div class="graph">
		<h3># Rebuttals</h3>
		<img src="/images/rebuttals.png" border="0" alt=""/>
	</div>


  </div>
  </body>
</html>
