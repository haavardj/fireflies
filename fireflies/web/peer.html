<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en" xmlns:nevow="http://nevow.com/ns/nevow/0.1">
	<head><link href="css/ff.css" type="text/css" rel="stylesheet" /></head>
  <body>

	<span nevow:pattern="content">
	
	<h2>Peer info for <span nevow:data="other" nevow:render="address">127.0.0.1</span> 
			<span nevow:data="other" nevow:render="browselink">[browse]</span></h2>

	<div nevow:data="other">
     <table class="peerinfo" cellspacing="0" border="0" cellpadding="3">
    	<tr><td><b>Id:</b></td>         <td><span nevow:render="id">1234</span></td></tr>
			<tr><td><b>Badness:</b></td>    <td><span nevow:render="badness">Correct</span></td></tr>
			<!--tr><td><b>Accused:</b></td><td><span nevow:render="accused">No</span></td></tr-->
			<tr><td><b>Pings:</b></td>      <td><span nevow:render="npings">0</span></td></tr>
			<tr><td><b>Avg. loss:</b></td><td><span nevow:render="avgloss">0</span></td></tr>
			<tr><td><b>Status:</b></td><td><span nevow:render="status">0</span></td></tr>
			<tr><td><b>Epoch:</b></td><td><span nevow:render="epoch"></span></td></tr>
			<tr><td><b>Mask:</b></td><td><span nevow:render="mask"></span></td></tr>
    </table>
  </div>
		
		

	<h2>Accusations</h2>
		<table cellspacing="10px" cellpadding="0" border="0" valign="top">
			<tr valign="top">
		     <td>
					
					<div class="box">		     
		     	<h3>Valid</h3>
						<div nevow:data="other" nevow:render="vaccusations"></div>
		     	</div>
		     	
		     </td>
 		     <td>
					
					<div class="box">		     
		     	<h3>Possible</h3>
						<div nevow:data="other" nevow:render="paccusations"></div>
		     	</div>
		  
		     </td>

		     <td>
		     
		     <div class="box">		    
		     	<h3>History</h3>
						<div nevow:data="other" nevow:render="accusationsHistory"></div>
		     </div>		    
		     </td>
		     
	    </tr>
		</table>   


	</span>
    
  </body>
</html>
