<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" lang="en" xml:lang="en" xmlns:nevow="http://nevow.com/ns/nevow/0.1">
  <body>
        
	<div nevow:pattern="content">

	
	<table nevow:data="peer" border="0">
			<tr><td><b>Node ID:</b></td><td nevow:render="id">Data</td></tr>
		  <tr><td><b>Badness:</b></td><td nevow:render="badness">Data</td></tr>
  		<tr><td><b>Lifeline:</b></td><td><span nevow:render="epoch"></span></td></tr>			
  		<tr><td><b>Version:</b></td><td><span nevow:render="version"></span></td></tr>			
	</table>


	<h2>Members</h2>
		<table cellspacing="10px" cellpadding="0" border="0" valign="top">
			<tr valign="top">
		     <td>
					<div class="box">		     
		     	<h3>Live</h3>
		     	<div nevow:data="members" nevow:render="members">[live]</div>
		     	</div>
		     	   	
		     </td>
		     <td>   
		     
		     <div class="box">		    
		     	<h3>Failed</h3>
		     <div nevow:data="failed" nevow:render="members"> [Failed table]</div>
		     </div>		    
		     </td>		     
	    </tr>
		</table>   
  </div>
  </body>
</html>
