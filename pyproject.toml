[build-system]
requires = ["setuptools>=77", "swig>=4.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fireflies"
version = "0.3.0"
description = "Byzantine-tolerant membership and gossip service for peer-to-peer overlay networks"
readme = "README.md"
license = "MIT AND GPL-2.0-only"
license-files = ["LICENCE", "fireflies/setrecon/COPYING"]
authors = [{ name = "Håvard Dagenborg" }]
requires-python = ">=3.10"
dependencies = [
    "twisted>=24.3",
    "cryptography>=42",
    "pyopenssl>=24",
    "service-identity>=24",
]

[project.optional-dependencies]
web = ["klein>=24.8", "jinja2>=3.1"]
dev = ["ruff>=0.17", "pyright>=1.1.400"]

[project.urls]
Homepage = "https://github.com/haavardj/fireflies"
Paper = "https://doi.org/10.1145/2701418"

[project.scripts]
fireflyd = "fireflies.cli.fireflyd:main"
ffcanew = "fireflies.cli.ffcanew:main"
ffreq = "fireflies.cli.ffreq:main"
ffcasign = "fireflies.cli.ffcasign:main"
ffcamember = "fireflies.cli.ffcamember:main"

[tool.setuptools]
packages = ["fireflies", "fireflies.cli", "fireflies.setrecon", "fireflies.test",
            "fireflies.web", "fireflies.web.templates", "fireflies.web.static"]

[tool.setuptools.package-data]
"fireflies.setrecon" = ["*.h", "*.i", "*.pyi"]
"fireflies.web.templates" = ["*.html"]
"fireflies.web.static" = ["*.css", "*.js", "*.md"]

[tool.ruff]
target-version = "py310"
extend-exclude = ["fireflies/setrecon/setreconbase.py"]

[tool.ruff.lint]
# F: pyflakes (undefined and unused names), B: bug patterns,
# UP: syntax that Python 3.10 no longer needs, I: import order (isort).
select = ["F", "B", "UP", "I"]
# Keep %-formatting; converting it to f-strings is style, not a fix.
ignore = ["UP031", "UP032"]

[tool.ruff.lint.per-file-ignores]
# Re-exports the SWIG module.
"fireflies/setrecon/setrecon.py" = ["F403"]
"fireflies/setrecon/__init__.py" = ["F403"]

[tool.ruff.lint.isort]
known-first-party = ["fireflies"]

[tool.pyright]
include = ["fireflies"]
exclude = ["fireflies/setrecon/setreconbase.py", "**/__pycache__"]
pythonVersion = "3.10"
# The daemon runs on Linux (gossip needs the C++ extension).
pythonPlatform = "Linux"
typeCheckingMode = "standard"
# The package is held to strict mode; the tests to standard mode.
# setreconbase.pyi types the SWIG module; update it with setreconbase.i.
strict = ["fireflies/*.py", "fireflies/cli", "fireflies/setrecon", "fireflies/web"]
