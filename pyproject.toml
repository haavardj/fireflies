[build-system]
requires = ["setuptools>=77", "swig>=4.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fireflies"
version = "0.3.0"
description = "Scalable, intrusion-tolerant group membership for peer-to-peer overlays"
readme = "README"
license-files = ["LICENCE"]
authors = [{ name = "Håvard Dagenborg" }]
requires-python = ">=3.10"
dependencies = [
    "twisted>=24.3",
    "cryptography>=42",
    "pyopenssl>=24",
    "service-identity>=24",
]

[project.optional-dependencies]
# Faster binomial CDF when computing the number of rings in ffcanew.
stats = ["scipy"]

[project.urls]
Homepage = "https://sourceforge.net/projects/fireflies"

[tool.setuptools]
packages = ["fireflies", "fireflies.setrecon", "fireflies.test"]
script-files = [
    "scripts/fireflyd",
    "scripts/ffcanew",
    "scripts/ffreq",
    "scripts/ffcasign",
    "scripts/ffcamember",
]

[tool.setuptools.package-data]
"fireflies.setrecon" = ["*.h", "*.i"]
