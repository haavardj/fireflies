[build-system]
requires = ["setuptools>=77", "swig>=4.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fireflies"
version = "0.3.0"
description = "Byzantine-tolerant membership and gossip service for peer-to-peer overlay networks"
readme = "README.md"
license = "MIT AND GPL-2.0-only"
license-files = ["LICENCE", "fireflies/setrecon/COPYING"]
authors = [{ name = "Håvard Dagenborg" }]
requires-python = ">=3.10"
dependencies = [
    "twisted>=24.3",
    "cryptography>=42",
    "pyopenssl>=24",
    "service-identity>=24",
]

[project.optional-dependencies]
web = ["klein>=24.8", "jinja2>=3.1"]

[project.urls]
Homepage = "https://github.com/haavardj/fireflies"
Paper = "https://doi.org/10.1145/2701418"

[project.scripts]
fireflyd = "fireflies.cli.fireflyd:main"
ffcanew = "fireflies.cli.ffcanew:main"
ffreq = "fireflies.cli.ffreq:main"
ffcasign = "fireflies.cli.ffcasign:main"
ffcamember = "fireflies.cli.ffcamember:main"

[tool.setuptools]
packages = ["fireflies", "fireflies.cli", "fireflies.setrecon", "fireflies.test",
            "fireflies.web", "fireflies.web.templates", "fireflies.web.static"]

[tool.setuptools.package-data]
"fireflies.setrecon" = ["*.h", "*.i"]
"fireflies.web.templates" = ["*.html"]
"fireflies.web.static" = ["*.css", "*.js", "*.md"]

[tool.pyright]
include = ["fireflies"]
exclude = ["fireflies/setrecon/setreconbase.py", "**/__pycache__"]
pythonVersion = "3.10"
# The daemon runs on Linux (gossip needs the C++ extension).
pythonPlatform = "Linux"
typeCheckingMode = "standard"
# Modules listed here are held to strict mode. Add a module once it is
# fully annotated.
strict = ["fireflies/crypto.py"]
